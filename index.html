<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Map Design</title>
    <meta name="viewport" content="wdith=device-width, initial-scale=1.0">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* the style of the layer control menu */
        #menu {
            background: #fff;
            position: absolute;
            z-index: 1;
            top: 10px;
            right: 10px;
            border-radius: 3px;
            width: 120px;
            border: 1px solid rgba(0, 0, 0, 0.4);
            font-family: 'Open Sans', sans-serif;
        }

        /* each layer on the menu */
        #menu a {
            font-size: 13px;
            color: #404040;
            display: block;
            margin: 0;
            padding: 0;
            padding: 10px;
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.25);
            text-align: center;
        }


        /* the last item of the layer items will not include a seperator */
        #menu a:last-child {
            border: none;
        }

        /* change color and background color while a pointer is on an hybrid link. */
        #menu a:hover {
            background-color: #f8f8f8;
            color: #404040;
        }

        #menu a.active {
            background-color: #3887be;
            color: #ffffff;
        }

        #menu a.active:hover {
            background: #3074a4;
        }

    </style>

</head>


<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 
        'pk.eyJ1IjoibnVnYWl5ZW4iLCJhIjoiY21rb29tNzZxMDMzYTNmcHBpYmlkZGJqNSJ9.aa6QqHmav1QDW8cZUNCBhw';
    const map = new mapboxgl.Map({
        container: 'map', // container ID
        center: [-122.2559435, 47.6002614], // starting position [lng, lat]. Note that lat must be set between -90 and 90
        zoom: 12 // starting zoom
    });



    map.on('load', () => {
        map.addSource('uw-tiles', {
            type: 'raster',
            tiles: [
            'assets/tile-sets-1/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            attribution: 'Map tiles designed by Bo Zhao'
        });

        map.addLayer({
            id: 'uw',
            type: 'raster',
            source: 'uw-tiles',
            layout: {
            // 'visibility': 'none'
            // Uncomment the line above to hide this layer on initial load.
            // This is useful when you add multiple tile layers.
            }
        }); // add layer 
    }); // map on load


</script>

</body>
</html>
